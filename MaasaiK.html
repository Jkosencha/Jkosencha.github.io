<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>Maasai Kreatives - JKOSENCHA</title>
    <link rel="stylesheet" href="infopages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Azeret+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/e13d111ddf.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="top-nav">
        <a href="portfolio.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> All Projects</a>
        <span class="nav-label">Project / Maasai Kreatives</span>
    </nav>

    <main class="page-wrapper">
        <header class="page-hero">
            <span class="tag">Web Design</span>
            <h1>Maasai<br>Kreatives</h1>
            <p>A vibrant front-end website designed for an artistic group celebrating Maasai creativity and culture.</p>
        </header>

        <section class="info-section">
            <h2>Project Screenshots</h2>
            <div class="gallery-grid" id="gallery">
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m1.png" alt="Screen 1"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m2.png" alt="Screen 2"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m3.png" alt="Screen 3"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m4.png" alt="Screen 4"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m5.png" alt="Screen 5"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m6.png" alt="Screen 6"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img loading="lazy" src="images/m7.png" alt="Screen 7"></div>
            </div>
        </section>

        <div class="contact-footer">
            <div class="cta-text">
                <h3>Want a site like this?</h3>
                <p>Let's build something beautiful for your brand.</p>
            </div>
            <a href="mailto:jenniferkosencha@gmail.com" class="cta-btn">
                <i class="fa-solid fa-paper-plane"></i> Get in Touch
            </a>
        </div>
    </main>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        function openLightbox(el) {
            const src = el.querySelector('img').src;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
